name: Validate project setup

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check skills
        run: python3 tests/check_skills.py
      - name: Check specification baseline
        run: python3 tests/check_specs.py
      - name: Check session handoff contract
        run: python3 -m unittest discover -s tests -p 'test_*.py'
